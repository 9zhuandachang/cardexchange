<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 · LPL Vault</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        .profile-section {
            padding-top: var(--spacing-80);
        }

        .profile-card {
            background: var(--surface-soft-white);
            border: 1px solid var(--border-quiet);
            border-radius: var(--radius-cards);
            padding: var(--card-padding);
            display: grid;
            grid-template-columns: 7fr 5fr;
            gap: var(--spacing-40);
            align-items: center;
        }

        .profile-identity {
            display: flex;
            align-items: center;
            gap: var(--spacing-24);
        }

        .profile-avatar {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-cards);
            border: 1px solid var(--border-input);
            background: var(--color-warm-white);
            color: var(--color-charcoal);
            font-size: var(--text-heading);
            font-weight: var(--font-weight-extralight);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .profile-name {
            font-size: var(--text-heading);
            font-weight: var(--font-weight-light);
            line-height: var(--leading-heading);
            color: var(--color-charcoal);
        }

        .profile-meta {
            margin-top: 4px;
            font-size: var(--text-body);
            color: var(--color-wood);
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-24);
            border-left: 1px solid var(--border-divider);
            padding-left: var(--spacing-40);
        }

        .stat-val {
            font-size: var(--text-heading);
            font-weight: var(--font-weight-extralight);
            color: var(--color-charcoal);
            line-height: 1.2;
        }

        .stat-lbl {
            margin-top: 4px;
            font-size: var(--text-label);
            letter-spacing: var(--tracking-label);
            color: var(--color-wood);
        }

        /* Vault Section */
        .vault-section {
            margin-top: var(--spacing-80);
        }

        .vault-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: var(--spacing-24);
            flex-wrap: wrap;
            padding-bottom: var(--spacing-16);
            margin-bottom: var(--spacing-40);
            border-bottom: 1px solid var(--border-divider);
        }

        .vault-tabs {
            display: flex;
            gap: var(--spacing-40);
            flex-wrap: wrap;
        }

        .vault-tab {
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            padding: 8px 0;
            font-size: var(--text-body-lg);
            font-weight: var(--font-weight-light);
            color: var(--color-wood);
            cursor: pointer;
            transition: color var(--transition-quiet), border-color var(--transition-quiet);
        }

        .vault-tab:hover {
            color: var(--color-moss);
        }

        .vault-tab.active {
            color: var(--color-charcoal);
            border-bottom-color: var(--color-moss);
        }

        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-24);
        }

        .order-row {
            background: var(--surface-soft-white);
            border: 1px solid var(--border-quiet);
            border-radius: var(--radius-cards);
            padding: var(--spacing-24) var(--card-padding);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-24);
            flex-wrap: wrap;
            transition: border-color var(--transition-quiet);
        }

        .order-row:hover {
            border-color: var(--border-hover);
        }

        .order-row-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-24);
        }

        .order-mini-frame {
            width: 50px;
            height: 70px;
            padding-top: 0;
            flex-shrink: 0;
        }

        .order-status {
            font-size: var(--text-label);
            letter-spacing: var(--tracking-label);
            color: var(--color-moss);
            margin-top: 4px;
            display: block;
        }

        @media (max-width: 860px) {
            .profile-card {
                grid-template-columns: 1fr;
            }
            .profile-stats {
                border-left: none;
                border-top: 1px solid var(--border-divider);
                padding-left: 0;
                padding-top: var(--spacing-24);
            }
        }
    </style>
</head>
<body>

<header id="site-header"></header>

<main class="container">
    <section class="profile-section">
        <div class="profile-card">
            <div class="profile-identity">
                <div class="profile-avatar" id="profileAvatar">L</div>
                <div>
                    <span class="label-text" id="profileStatusLabel">Guest</span>
                    <h1 class="profile-name" id="profileName">访客收藏家</h1>
                    <p class="profile-meta" id="profileMeta">登录后同步个人持仓卡库与本地订单记录</p>
                </div>
            </div>

            <div class="profile-stats">
                <div>
                    <div class="stat-val tabular" id="statOwnedCount">0</div>
                    <div class="stat-lbl">持仓卡片</div>
                </div>
                <div>
                    <div class="stat-val tabular" id="statFavCount">0</div>
                    <div class="stat-lbl">收藏夹</div>
                </div>
                <div>
                    <div class="stat-val tabular" id="statOrderCount">0</div>
                    <div class="stat-lbl">本地订单</div>
                </div>
            </div>
        </div>
    </section>

    <section class="vault-section">
        <div class="vault-header">
            <div class="vault-tabs" role="tablist">
                <button type="button" class="vault-tab active" data-tab="inventory">持仓卡库</button>
                <button type="button" class="vault-tab" data-tab="favorites">收藏夹</button>
                <button type="button" class="vault-tab" data-tab="orders">交易订单</button>
            </div>
            <div id="vaultRightAction"></div>
        </div>

        <div class="tab-pane active" id="pane-inventory">
            <div class="card-grid" id="inventoryGrid"></div>
        </div>

        <div class="tab-pane" id="pane-favorites">
            <div class="card-grid" id="favoritesGrid"></div>
        </div>

        <div class="tab-pane" id="pane-orders">
            <div class="order-list" id="ordersList"></div>
        </div>
    </section>
</main>

<footer id="site-footer"></footer>

<script src="js/common.js"></script>
<script>
    LPLVault.renderNavbar('user');
    LPLVault.renderFooter();

    function switchTab(name) {
        document.querySelectorAll('.vault-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === `pane-${name}`));
    }

    document.querySelectorAll('.vault-tab').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    function renderOrders() {
        const orders = LPLVault.getOrders();
        document.getElementById('statOrderCount').textContent = orders.length;
        const listEl = document.getElementById('ordersList');

        if (!orders.length) {
            listEl.innerHTML = `
                <div class="empty-state">
                    <h3>暂无本地订单记录</h3>
                    <p>在卡片详情页确认下单后，订单会保存在此列表中供随时回溯。</p>
                    <a href="home.html" class="quiet-btn quiet-btn-outline quiet-btn-sm">前往交易大厅</a>
                </div>
            `;
            return;
        }

        listEl.innerHTML = orders.map(o => `
            <div class="order-row">
                <div class="order-row-left">
                    <div class="card-art-frame order-mini-frame">
                        <img src="${LPLVault.escapeHtml(LPLVault.getCardImageSrc(o.img_url))}" alt="">
                    </div>
                    <div>
                        <a href="detail.html?id=${encodeURIComponent(o.cardId)}" style="font-size:16px;color:var(--color-charcoal);">
                            ${LPLVault.escapeHtml(o.team)} · ${LPLVault.escapeHtml(o.playerName)}
                        </a>
                        <div style="font-size:13px;color:var(--color-wood);margin-top:4px;">
                            订单号 ${LPLVault.escapeHtml(o.orderNo)} · ${LPLVault.escapeHtml(o.createdAt)}
                        </div>
                    </div>
                </div>
                <div style="text-align:right;">
                    <div class="tabular" style="font-size:20px;color:var(--color-charcoal);">¥ ${LPLVault.formatPrice(o.price)}</div>
                    <span class="order-status">${LPLVault.escapeHtml(o.status)}</span>
                </div>
            </div>
        `).join('');
    }

    (async function init() {
        const user = LPLVault.getUser();
        const rightAction = document.getElementById('vaultRightAction');

        if (user) {
            const name = user.username || user.name || '藏家';
            document.getElementById('profileAvatar').textContent = name.charAt(0).toUpperCase();
            document.getElementById('profileStatusLabel').textContent = `COLLECTOR · UID #${user.id || 1}`;
            document.getElementById('profileName').textContent = name;
            document.getElementById('profileMeta').textContent = user.email ? `邮箱：${user.email}` : '已登录账号';
            rightAction.innerHTML = `<button type="button" class="text-link" id="profileLogoutBtn">退出登录</button>`;
            document.getElementById('profileLogoutBtn').addEventListener('click', LPLVault.logout);
        } else {
            rightAction.innerHTML = `<a href="login.html?redirect=userInfo.html" class="text-link">登录账号 &rarr;</a>`;
        }

        renderOrders();

        try {
            const allCards = await LPLVault.fetchCardList({ sort: 'price_desc' });

            const favIds = LPLVault.getFavorites();
            const favCards = allCards.filter(c => favIds.includes(Number(c.id)));
            document.getElementById('statFavCount').textContent = favCards.length;
            const favGrid = document.getElementById('favoritesGrid');
            if (favCards.length) {
                favCards.forEach(c => favGrid.appendChild(LPLVault.createTradingCardElement(c)));
            } else {
                favGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>收藏夹目前为空</h3>
                        <p>浏览交易大厅时点击卡片右下角「收藏」，即可将心仪卡片留在这里。</p>
                        <a href="home.html" class="quiet-btn quiet-btn-outline quiet-btn-sm">浏览在售卡片</a>
                    </div>
                `;
            }

            const invGrid = document.getElementById('inventoryGrid');
            if (!user) {
                document.getElementById('statOwnedCount').textContent = '0';
                invGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>登录后查看持仓卡库</h3>
                        <p>可使用演示账号 demo / 123456 登录并查看当前持仓。</p>
                        <a href="login.html?redirect=userInfo.html" class="quiet-btn quiet-btn-sm">前往登录</a>
                    </div>
                `;
            } else {
                const res = await fetch(`/card/user/${encodeURIComponent(user.id || 1)}`);
                const owned = res.ok ? await res.json() : [];
                document.getElementById('statOwnedCount').textContent = owned.length;
                if (owned.length) {
                    owned.forEach(c => invGrid.appendChild(LPLVault.createTradingCardElement(c)));
                } else {
                    invGrid.innerHTML = `
                        <div class="empty-state">
                            <h3>当前卡库为空</h3>
                            <p>前往交易大厅挑选一张心仪的选手卡吧。</p>
                            <a href="home.html" class="quiet-btn quiet-btn-outline quiet-btn-sm">浏览交易大厅</a>
                        </div>
                    `;
                }
            }
        } catch (err) {
            console.error(err);
            LPLVault.showToast('加载个人卡库失败', 'error');
        }
    })();
</script>
</body>
</html>
