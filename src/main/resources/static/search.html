<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全库检索 · LPL Vault</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        .search-intro {
            padding: var(--spacing-56) 0 var(--spacing-40);
            border-bottom: 1px solid var(--border-divider);
            margin-bottom: var(--spacing-40);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: var(--spacing-24);
            flex-wrap: wrap;
        }

        .search-intro h1 {
            font-size: var(--text-heading);
            font-weight: var(--font-weight-light);
            line-height: var(--leading-heading);
            margin-top: 8px;
        }

        /* Asymmetric sidebar + airy 2-col gallery */
        .search-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: var(--spacing-56);
            align-items: start;
        }

        .filter-panel {
            position: sticky;
            top: 112px;
            background: var(--surface-soft-white);
            border: 1px solid var(--border-quiet);
            border-radius: var(--radius-cards);
            padding: var(--card-padding);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-40);
        }

        .filter-panel-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: var(--spacing-16);
            border-bottom: 1px solid var(--border-divider);
        }

        .filter-panel-head h2 {
            font-size: var(--text-body-lg);
            font-weight: var(--font-weight-regular);
        }

        .filter-block-title {
            font-size: var(--text-label);
            letter-spacing: var(--tracking-label);
            color: var(--color-wood);
            text-transform: uppercase;
            margin-bottom: var(--spacing-16);
        }

        .option-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quiet-chip {
            background: transparent;
            border: 1px solid var(--border-quiet);
            border-radius: var(--radius-buttons);
            padding: 5px 11px;
            font-size: 13px;
            font-weight: var(--font-weight-light);
            color: var(--color-wood);
            cursor: pointer;
            transition: border-color var(--transition-quiet), color var(--transition-quiet), background-color var(--transition-quiet);
        }

        .quiet-chip:hover {
            border-color: var(--border-hover);
            color: var(--color-moss);
        }

        .quiet-chip.active {
            border-color: var(--color-moss);
            color: var(--color-charcoal);
            background: rgba(90, 122, 107, 0.09);
        }

        .radio-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: var(--text-body);
            color: var(--color-charcoal);
            cursor: pointer;
        }

        .radio-row input {
            accent-color: var(--color-moss);
        }

        .results-toolbar {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: var(--spacing-24);
            flex-wrap: wrap;
            margin-bottom: var(--spacing-24);
        }

        .results-count {
            font-size: var(--text-body);
            color: var(--color-wood);
        }

        .active-tags {
            display: flex;
            align-items: center;
            gap: var(--spacing-16);
            flex-wrap: wrap;
            margin-bottom: var(--spacing-40);
        }

        .active-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 10px;
            border: 1px solid var(--border-input);
            border-radius: var(--radius-cards);
            background: var(--surface-soft-white);
            font-size: var(--text-label);
            letter-spacing: 0.06em;
            color: var(--color-charcoal);
        }

        .active-tag button {
            background: none;
            border: none;
            color: var(--color-wood);
            cursor: pointer;
            font-size: 14px;
            line-height: 1;
            transition: color var(--transition-quiet);
        }

        .active-tag button:hover {
            color: var(--color-moss);
        }

        .search-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        @media (max-width: 860px) {
            .search-layout {
                grid-template-columns: 1fr;
                gap: var(--spacing-40);
            }
            .filter-panel {
                position: static;
            }
        }

        @media (max-width: 600px) {
            .search-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header id="site-header"></header>

<main class="container">
    <section class="search-intro">
        <div>
            <span class="label-text">Archive Search</span>
            <h1>全库卡片检索</h1>
        </div>
        <div style="width: 170px;">
            <select class="line-select" id="searchSort" aria-label="排序方式">
                <option value="price_desc">价格从高到低</option>
                <option value="price_asc">价格从低到高</option>
                <option value="grade">按稀有评级优先</option>
            </select>
        </div>
    </section>

    <div class="search-layout">
        <aside class="filter-panel">
            <div class="filter-panel-head">
                <h2>筛选条件</h2>
                <button type="button" class="text-link" id="resetFiltersBtn" style="font-size:12px;">重置</button>
            </div>

            <div>
                <div class="filter-block-title">关键词</div>
                <input type="text" class="line-input" id="kwInput" placeholder="输入战队、选手或卡号" aria-label="关键词搜索">
                <button type="button" class="quiet-btn quiet-btn-outline quiet-btn-sm" id="sideRecognizeBtn" style="width:100%;margin-top:16px;">以图识选手</button>
            </div>

            <div>
                <div class="filter-block-title">战队</div>
                <div class="option-wrap" id="sideTeams"></div>
            </div>

            <div>
                <div class="filter-block-title">评级</div>
                <div class="option-wrap" id="sideGrades">
                    <button type="button" class="quiet-chip active" data-grade="ALL">全部</button>
                    <button type="button" class="quiet-chip" data-grade="S">S 级</button>
                    <button type="button" class="quiet-chip" data-grade="A">A 级</button>
                    <button type="button" class="quiet-chip" data-grade="B">B 级</button>
                </div>
            </div>

            <div>
                <div class="filter-block-title">价位区间</div>
                <div class="radio-list">
                    <label class="radio-row"><input type="radio" name="priceRange" value="all" checked> 全部价位</label>
                    <label class="radio-row"><input type="radio" name="priceRange" value="0-200"> ¥200 以下</label>
                    <label class="radio-row"><input type="radio" name="priceRange" value="200-400"> ¥200 – ¥400</label>
                    <label class="radio-row"><input type="radio" name="priceRange" value="400-99999"> ¥400 以上</label>
                </div>
            </div>

            <div>
                <label class="radio-row">
                    <input type="checkbox" id="onlyLimitedChk">
                    仅查看限量编号卡
                </label>
            </div>
        </aside>

        <section>
            <div class="results-toolbar">
                <span class="results-count" id="resultsCount">正在检索馆藏…</span>
            </div>

            <div class="active-tags" id="activeTags"></div>

            <div class="card-grid search-grid" id="searchGrid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </section>
    </div>
</main>

<footer id="site-footer"></footer>

<script src="js/common.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const initialGrade = (params.get('grade') || 'ALL').toUpperCase();
    LPLVault.renderNavbar(initialGrade === 'S' ? 'limited' : 'search');
    LPLVault.renderFooter();
    document.getElementById('sideRecognizeBtn').addEventListener('click', () => LPLVault.openRecognizeModal());

    let allCards = [];
    const filterState = {
        keyword: params.get('q') || '',
        team: (params.get('team') || 'ALL').toUpperCase(),
        grade: initialGrade,
        priceRange: 'all',
        onlyLimited: false,
        sort: params.get('sort') || 'price_desc'
    };

    const kwInput = document.getElementById('kwInput');
    kwInput.value = filterState.keyword;

    function buildTeamChips(cards) {
        const teams = Array.from(new Set(cards.map(c => c.team).filter(Boolean))).sort();
        const wrap = document.getElementById('sideTeams');
        wrap.innerHTML = '';

        ['ALL', ...teams].forEach(t => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = `quiet-chip ${filterState.team === t ? 'active' : ''}`;
            btn.dataset.team = t;
            btn.textContent = t === 'ALL' ? '全部' : t;
            btn.addEventListener('click', () => {
                filterState.team = t;
                syncControls();
                renderResults();
            });
            wrap.appendChild(btn);
        });
    }

    function syncControls() {
        kwInput.value = filterState.keyword;
        document.querySelectorAll('#sideTeams .quiet-chip').forEach(b => b.classList.toggle('active', b.dataset.team === filterState.team));
        document.querySelectorAll('#sideGrades .quiet-chip').forEach(b => b.classList.toggle('active', b.dataset.grade === filterState.grade));
        document.querySelectorAll('input[name="priceRange"]').forEach(r => { r.checked = r.value === filterState.priceRange; });
        document.getElementById('onlyLimitedChk').checked = filterState.onlyLimited;
        document.getElementById('searchSort').value = filterState.sort;
    }

    function renderActiveTags() {
        const container = document.getElementById('activeTags');
        const tags = [];
        if (filterState.keyword.trim()) {
            tags.push({ label: `关键词 · ${filterState.keyword}`, clear: () => { filterState.keyword = ''; } });
        }
        if (filterState.team !== 'ALL') {
            tags.push({ label: `战队 · ${filterState.team}`, clear: () => { filterState.team = 'ALL'; } });
        }
        if (filterState.grade !== 'ALL') {
            tags.push({ label: `评级 · ${filterState.grade} 级`, clear: () => { filterState.grade = 'ALL'; } });
        }
        if (filterState.priceRange !== 'all') {
            const map = { '0-200': '¥200 以下', '200-400': '¥200–400', '400-99999': '¥400 以上' };
            tags.push({ label: `价位 · ${map[filterState.priceRange]}`, clear: () => { filterState.priceRange = 'all'; } });
        }
        if (filterState.onlyLimited) {
            tags.push({ label: '仅限量编号', clear: () => { filterState.onlyLimited = false; } });
        }

        container.innerHTML = '';
        container.style.display = tags.length ? 'flex' : 'none';
        tags.forEach(t => {
            const span = document.createElement('span');
            span.className = 'active-tag';
            span.innerHTML = `${LPLVault.escapeHtml(t.label)} <button type="button" aria-label="移除该条件">&times;</button>`;
            span.querySelector('button').addEventListener('click', () => {
                t.clear();
                syncControls();
                renderResults();
            });
            container.appendChild(span);
        });
    }

    function renderResults() {
        renderActiveTags();
        const kw = filterState.keyword.trim().toLowerCase();
        const [minP, maxP] = filterState.priceRange === 'all' ? [0, Infinity] : filterState.priceRange.split('-').map(Number);

        let list = allCards.filter(c => {
            if (filterState.team !== 'ALL' && (c.team || '').toUpperCase() !== filterState.team) return false;
            if (filterState.grade !== 'ALL' && String(c.grade || '').toUpperCase() !== filterState.grade) return false;
            const p = Number(c.price || 0);
            if (p < minP || p > maxP) return false;
            if (filterState.onlyLimited && !c.limited) return false;
            if (kw) {
                const hay = [c.team, c.playerName, c.series, c.cardNumber, c.cardType, c.parallel, c.releaseYear, LPLVault.getTeamFullName(c.team)]
                    .join(' ').toLowerCase();
                if (!hay.includes(kw)) return false;
            }
            return true;
        });

        const gradeRank = g => ({ S: 1, A: 2, B: 3 }[String(g || '').toUpperCase()] || 9);
        if (filterState.sort === 'price_desc') {
            list.sort((a, b) => Number(b.price || 0) - Number(a.price || 0));
        } else if (filterState.sort === 'price_asc') {
            list.sort((a, b) => Number(a.price || 0) - Number(b.price || 0));
        } else {
            list.sort((a, b) => gradeRank(a.grade) - gradeRank(b.grade) || Number(b.price || 0) - Number(a.price || 0));
        }

        document.getElementById('resultsCount').textContent = `共找到 ${list.length} 张符合条件的卡片`;
        const grid = document.getElementById('searchGrid');
        grid.innerHTML = '';

        if (!list.length) {
            grid.innerHTML = `
                <div class="empty-state">
                    <h3>未检索到匹配的卡片</h3>
                    <p>可尝试输入战队简称（如 BLG、TES、WBG）或选手名称（如 BIN、KNIGHT、RULER）。</p>
                    <button type="button" class="quiet-btn quiet-btn-outline quiet-btn-sm" id="clearEmptyBtn">清空筛选条件</button>
                </div>
            `;
            document.getElementById('clearEmptyBtn').addEventListener('click', resetAll);
            return;
        }

        const frag = document.createDocumentFragment();
        list.forEach(c => frag.appendChild(LPLVault.createTradingCardElement(c)));
        grid.appendChild(frag);
    }

    function resetAll() {
        filterState.keyword = '';
        filterState.team = 'ALL';
        filterState.grade = 'ALL';
        filterState.priceRange = 'all';
        filterState.onlyLimited = false;
        filterState.sort = 'price_desc';
        syncControls();
        renderResults();
    }

    kwInput.addEventListener('input', () => { filterState.keyword = kwInput.value; renderResults(); });
    document.querySelectorAll('#sideGrades .quiet-chip').forEach(b => {
        b.addEventListener('click', () => { filterState.grade = b.dataset.grade; syncControls(); renderResults(); });
    });
    document.querySelectorAll('input[name="priceRange"]').forEach(r => {
        r.addEventListener('change', () => { filterState.priceRange = r.value; renderResults(); });
    });
    document.getElementById('onlyLimitedChk').addEventListener('change', (e) => {
        filterState.onlyLimited = e.target.checked;
        renderResults();
    });
    document.getElementById('searchSort').addEventListener('change', (e) => {
        filterState.sort = e.target.value;
        renderResults();
    });
    document.getElementById('resetFiltersBtn').addEventListener('click', resetAll);

    (async function init() {
        try {
            allCards = await LPLVault.fetchCardList({ sort: 'price_desc' });
            buildTeamChips(allCards);
            syncControls();
            renderResults();
        } catch (err) {
            console.error(err);
            LPLVault.showToast('加载检索数据失败', 'error');
        }
    })();
</script>
</body>
</html>
