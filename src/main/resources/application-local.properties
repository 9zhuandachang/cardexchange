# Local development profile using embedded H2 database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:file:./data/cardexchange;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
server.servlet.session.timeout=60m

ai.service.url=http://localhost:8001
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
